<!--
  Page unique du site. Ce fichier ne pose que le squelette (barre du haut,
  barre latérale, zone de contenu) : la navigation et le contenu sont
  construits par js/app.js à partir des données de js/data/*.js.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Codage pour les Nuls</title>
  <meta name="description" content="Le pense-bête qu'on garde ouvert dans un coin : C, C++, Arduino, HTML, CSS, JavaScript, Python, Git et Markdown expliqués simplement, avec un guide d'utilisation pour chaque langage.">
  <!-- Applique le thème mémorisé avant l'affichage, pour éviter un flash clair/sombre. -->
  <script>
    try {
      var theme = localStorage.getItem('theme');
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <!-- Polices : IBM Plex Sans (texte), JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span class="brand-name">Le Codage pour les Nuls</span>
    </a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" aria-label="Rechercher dans toutes les fiches" placeholder="Rechercher : malloc, flexbox, git rebase…" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Changer de thème (clair / sombre)">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="layout">
    <!-- Rempli par renderNav() dans js/app.js -->
    <nav class="sidebar" id="nav" aria-label="Aide-mémoire"></nav>
    <!-- Rempli par render() dans js/app.js -->
    <main id="contenu" tabindex="-1"></main>
  </div>

  <!-- Chaque fichier ajoute sa page à window.CHEATSHEET_DATA. Pour en ajouter
       une : créer js/data/monlangage.js sur le modèle des autres, l'inclure ici
       (avant js/app.js), puis l'ajouter à NAV_RAW dans js/app.js. -->
  <script src="js/data/accueil.js"></script>
  <script src="js/data/c.js"></script>
  <script src="js/data/cpp.js"></script>
  <script src="js/data/arduino.js"></script>
  <script src="js/data/python.js"></script>
  <script src="js/data/web.js"></script>
  <script src="js/data/html.js"></script>
  <script src="js/data/css.js"></script>
  <script src="js/data/js.js"></script>
  <script src="js/data/git.js"></script>
  <script src="js/data/markdown.js"></script>
  <!-- Doit être chargé APRÈS tous les fichiers de données ci-dessus. -->
  <script src="js/app.js"></script>
</body>
</html>
